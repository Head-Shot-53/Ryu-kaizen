{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="{% block meta_description %}Ryu Kaizen sportswear store{% endblock %}"
    >

    <title>
        {% block title %}Ryu Kaizen{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/base.css' %}"
    >

    {% block extra_css %}
    {% endblock %}
</head>

<body>
    {% include "includes/header.html" %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% include "includes/footer.html" %}

    <script src="{% static 'js/main.js' %}" defer></script>

    {% block extra_js %}
    {% endblock %}
</body>
</html>
